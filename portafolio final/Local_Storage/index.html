<!--
  ============================================================================
  PERSISTENCIA EN EL NAVEGADOR CON LOCALSTORAGE (Local_Storage/index.html)
  ============================================================================
  Complemento: Se agregó una interfaz interactiva para demostrar cómo serializar
  arreglos y objetos con `JSON.stringify()`, guardarlos en `localStorage` y
  recuperarlos con `JSON.parse()`.
-->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <title>Práctica de LocalStorage y JSON</title>
</head>
<body class="bg-light p-5">
    <div class="card shadow-sm mx-auto" style="max-width: 600px;">
        <div class="card-header bg-dark text-white fw-bold">
            💾 Persistencia con Web Storage API (localStorage)
        </div>
        <div class="card-body">
            <p class="text-muted">Guarda y recupera datos persistentes en el navegador usando <code>JSON.stringify()</code> y <code>JSON.parse()</code>.</p>
            <div class="d-flex gap-2 mb-3">
                <input type="text" id="itemInput" class="form-control" placeholder="Escribe un dato para guardar en localStorage...">
                <button onclick="guardarElemento()" class="btn btn-primary">Guardar</button>
                <button onclick="limpiarStorage()" class="btn btn-outline-danger">Limpiar</button>
            </div>
            <h6>Contenido actual de <code>localStorage["llave"]</code>:</h6>
            <pre id="storageViewer" class="bg-dark text-success p-3 rounded-2 mb-0"></pre>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
