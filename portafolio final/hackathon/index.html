<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <title>Hackathon - Extractor de Parámetros URL</title>
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="card shadow-sm mx-auto" style="max-width: 650px;">
            <div class="card-header bg-dark text-white fw-bold">
                🏆 Reto Hackathon: Parser de Parámetros de URL
            </div>
            <div class="card-body">
                <p class="text-muted">
                    Extrae los valores de los parámetros <code>nombre</code> y <code>edad</code> de una URL utilizando manipulación de strings (<code>search</code> y <code>slice</code>) y compáralo con <code>URLSearchParams</code>.
                </p>
                <label for="urlInput" class="form-label fw-semibold">URL de entrada:</label>
                <input type="text" id="urlInput" class="form-control mb-3" value="https://urldelapagina.com?nombre=Miguel&edad=125">
                <button onclick="procesarUrl()" class="btn btn-primary">Extraer Parámetros</button>

                <div class="mt-4">
                    <h6>Resultado extraído (Array):</h6>
                    <pre id="output" class="bg-dark text-info p-3 rounded-2 mb-0"></pre>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
