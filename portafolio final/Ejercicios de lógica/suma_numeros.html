<html lang="es">

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary shadow-sm mb-4">
        <div class="container-fluid">

          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">

    <div class="text-center d-flex justify-content-center align-items-center p-4 border rounded-3 shadow-sm w-50 flex-wrap mx-auto">
        <h1>Suma de números hasta N</h1>
        <label class="w-100 m-2" for="numero">Ingrese el número hasta donde quiere sumar</label>
        <input class="form-control w-75" type="number" id="numero" placeholder="Ej: 100">
        <div class="w-100">
            <button onclick="suma()" class="btn btn-primary m-2" type="button">Sumar</button>
        </div>
        <p class="w-100 mt-2" id="respuesta"></p>
