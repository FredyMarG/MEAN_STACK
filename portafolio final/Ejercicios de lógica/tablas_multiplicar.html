<!--
  ============================================================================
  EJERCICIO 5: TABLAS DE MULTIPLICAR DINÁMICAS (tablas_multiplicar.html)
  ============================================================================
  Propósito: Generar dinámicamente las filas de una tabla de multiplicar
  desde 1 hasta el límite indicado por el usuario.
  Corrección aplicada: Se eliminó el carácter '8' huérfano antes de <!DOCTYPE html>.
-->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css">
    <title>Tablas de multiplicar</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary shadow-sm mb-4">
        <div class="container-fluid">
          <a class="navbar-brand fw-bold" href="index.html">⚡ Lógica JS</a>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
              <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
              <li class="nav-item"><a class="nav-link" href="suma_numeros.html">Sumar Números</a></li>
              <li class="nav-item"><a class="nav-link" href="par_impar.html">Par o Impar</a></li>
              <li class="nav-item"><a class="nav-link" href="pizza.html">Pizzería</a></li>
              <li class="nav-item"><a class="nav-link" href="menu.html">Menú Texto</a></li>
              <li class="nav-item"><a class="nav-link" href="menu_checkbox.html">Menú Checkbox</a></li>
              <li class="nav-item"><a class="nav-link active fw-semibold" href="tablas_multiplicar.html">Tablas</a></li>
              <li class="nav-item"><a class="nav-link" href="descuentos.html">Descuentos</a></li>
            </ul>
          </div>
        </div>
    </nav>

    <div class="text-center d-flex justify-content-center align-items-center p-4 border rounded-3 shadow-sm w-50 flex-wrap mx-auto">
        <h1>Tablas de multiplicar</h1>

        <div class="d-flex justify-content-center align-items-center w-100">
            <div class="w-50 p-1">
                <label class="w-100 m-2" for="multiplo">Número base de la tabla</label>
                <input class="form-control" type="number" id="multiplo" placeholder="Ej: 7">
            </div>
            <div class="w-50 p-1">
                <label class="w-100 m-2" for="final">Multiplicar hasta el número</label>
                <input class="form-control" type="number" id="final" placeholder="Ej: 10">
            </div>
        </div>

        <button onclick="multiplicar()" class="btn btn-primary m-3" type="button">Generar tabla</button>
        <table id="table" class="table table-striped table-bordered mt-2">
            <thead>
                <tr>
                    <th colspan="5">Tabla de multiplicar</th>
                </tr>
            </thead>
            <tbody id="tbody">
            </tbody>
        </table>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/sumar_numeros.js"></script>
</body>
</html>
