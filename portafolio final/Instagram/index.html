<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css" integrity="sha512-SzlrxWUlpfuzQ+pcUCosxcglQRNAq/DZjVsC0lE40xsADsfeQoEypE+enwcOiGjk/bSuGGKHEyjSoQ1zVisanQ==" crossorigin="anonymous" referrerpolicy="no-referrer">

    <div class="image">

                <input type="password" class="size pss" placeholder="Contraseña">

                <input type="submit" value="Acceso" class="size button">


            </div>

            <div class="line"></div>
            <div class="word">O</div>
            <div class="line"></div>

            <button type="submit" class="icon"><i class="fa-brands fa-square-facebook"></i>Iniciar sesión con Facebook</button>

            <div class="forgotpass">

            </div>

        </div>

        <div class="create">¿No tienes una cuenta?<a href="#">Incribirse</a></div>

        <div class="get">
            <p>Obtener la aplicación</p>            
            <img src="assets/img/google play.jpg" alt="" class="ps">
            <img src="assets/img/microsoft.jpg" alt="" class="ps">

    </div>

    <div class="end">

        <div class="main">
            <a href="">Meta</a>
            <a href="">Acerca de</a>

            <a href="">Instagram Lite</a>

            <a href="">Metaverificado</a>         
              
        </div>

        <div class="second">
            <p>Inglés<i class="fa-solid fa-chevron-down"></i></p>
            <p>© 2023 Instagram de Meta</p>
        </div>

    </div>
