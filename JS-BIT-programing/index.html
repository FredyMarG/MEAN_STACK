<!--
  ============================================================================
  BUSCADOR DEL SIGUIENTE NÚMERO PRIMO (JS-BIT-programing/index.html)
  ============================================================================
  Propósito: Interfaz para evaluar si un número ingresado por el usuario es
  primo y calcular inmediatamente cuál es el siguiente número primo (Teorema
  de Chebyshev / Postulado de Bertrand: siempre existe al menos un primo entre
  n y 2n).
-->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <title>Algoritmo: Siguiente Número Primo</title>
</head>
<body class="bg-light p-5">
    <div class="card shadow-sm mx-auto" style="max-width: 520px;">
        <div class="card-header bg-primary text-white fw-bold">
            🔢 Algoritmo de Números Primos (JS-BIT)
        </div>
        <div class="card-body text-center">
            <p class="text-muted">Ingresa un número para verificar si es primo y encontrar el siguiente número primo.</p>
            <input type="number" id="numInput" class="form-control mb-3" placeholder="Ej: 14" min="1">
            <div class="d-flex justify-content-center gap-2">
                <button onclick="calcularDesdeInput()" class="btn btn-primary" type="button">Calcular en Pantalla</button>
                <button onclick="ejecutarConPrompt()" class="btn btn-outline-secondary" type="button">Usar Prompt</button>
            </div>
            <div id="resultadoPrimo" class="mt-3"></div>
        </div>
    </div>

    <script src="js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"></script>
</body>
</html>
