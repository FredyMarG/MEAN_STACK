<!--
  ============================================================================
  MODAL DE INICIO DE SESIÓN CON BOOTSTRAP 5 (Login/index.html)
  ============================================================================
  Propósito: Implementar una ventana modal emergente (Modal Dialog) para inicio
  de sesión utilizando componentes de Bootstrap 5.3, validación de formulario
  y panel de estado de sesión activa.
-->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Log-in Modal Bootstrap 5</title>
</head>
<body class="d-flex flex-column justify-content-center align-items-center vh-100">
    
    <div class="auth-hero-card text-center p-5 rounded-4 shadow-lg">
        <span class="badge bg-primary-subtle text-primary rounded-pill px-3 py-2 mb-3 fw-semibold">Bootstrap 5 Modal Auth</span>
        <h2 class="fw-bold mb-2">Portal de Autenticación</h2>
        <p class="text-muted mb-4">Haz clic en el botón para desplegar el formulario emergente de inicio de sesión.</p>

        <!-- Estado de Sesión Activa -->
        <div id="sessionAlert" class="alert alert-success d-none mb-4 text-start">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <strong>Sesión activa:</strong> <span id="loggedUserText"></span>
                </div>
                <button id="logoutBtn" class="btn btn-sm btn-outline-success">Cerrar sesión</button>
            </div>
        </div>

        <!-- Botón disparador del modal -->
        <button type="button" class="btn btn-primary btn-lg px-4 shadow-sm fw-semibold" data-bs-toggle="modal" data-bs-target="#exampleModal">
            Abrir Modal de Log-In
        </button>
    </div>
  
    <!-- Estructura del Modal -->
    <div class="modal fade" id="exampleModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content shadow-lg">
          <div class="modal-header bg-primary text-white">
            <h5 class="modal-title fw-bold" id="exampleModalLabel">Acceso de Usuario</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <form id="loginForm">
            <div class="modal-body p-4">
              <h4 class="text-center fw-bold mb-3">Bienvenido</h4>
              <div id="modalError" class="alert alert-danger py-2 small d-none">Por favor completa usuario y contraseña.</div>

              <div class="mb-3">
                  <label for="username" class="form-label fw-semibold">Usuario o Correo</label>
                  <input type="text" class="form-control" name="username" id="username" placeholder="ej. fredy.martinez" required>
              </div>

              <div class="mb-3">
                  <label for="password" class="form-label fw-semibold">Contraseña</label>
                  <input type="password" class="form-control" name="password" id="password" placeholder="••••••••" required>
              </div>
            </div>
            <div class="modal-footer bg-light">
              <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-primary fw-semibold">Iniciar Sesión</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const loginForm = document.getElementById("loginForm");
      const sessionAlert = document.getElementById("sessionAlert");
      const loggedUserText = document.getElementById("loggedUserText");
      const logoutBtn = document.getElementById("logoutBtn");
      const modalEl = document.getElementById("exampleModal");

      loginForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const user = document.getElementById("username").value.trim();
        const pass = document.getElementById("password").value.trim();
        if (!user || !pass) return;

        loggedUserText.textContent = user;
        sessionAlert.classList.remove("d-none");
        loginForm.reset();
        const modalInstance = bootstrap.Modal.getInstance(modalEl);
        if (modalInstance) modalInstance.hide();
      });

      logoutBtn.addEventListener("click", () => {
        sessionAlert.classList.add("d-none");
      });
    </script>
</body>
</html>
