<!--
  ============================================================================
  MODAL DE INICIO DE SESIÓN CON BOOTSTRAP 5 (Login/index.html)
  ============================================================================
  Propósito educativo (Curso MEAN Stack):
  1. Ventana modal emergente (`bootstrap.Modal`) con validación de formulario.
  2. Botón para mostrar/ocultar contraseña (`type="password"` ↔ `type="text"`).
  3. Opción "Recordarme" que enseña la diferencia entre `localStorage`
     (persistente) y `sessionStorage` (solo mientras dure la pestaña).
-->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="style.css" />
  <title>Log-in Modal Bootstrap 5</title>
</head>
<body class="d-flex flex-column justify-content-center align-items-center vh-100">

  <!-- Tarjeta principal del portal -->
  <div class="auth-hero-card text-center p-5 rounded-4 shadow-lg">
    <span class="badge bg-primary-subtle text-primary rounded-pill px-3 py-2 mb-3 fw-semibold">
      Bootstrap 5 Modal Auth
    </span>
    <h2 class="fw-bold mb-2">Portal de Autenticación</h2>
    <p class="text-muted mb-4">
      Haz clic en el botón para desplegar el modal de inicio de sesión con validación y almacenamiento.
    </p>

    <!-- Estado de sesión activa -->
    <div id="sessionAlert" class="alert alert-success d-none mb-4 text-start">
      <div class="d-flex justify-content-between align-items-center gap-2">
        <div>
          <strong>Sesión activa:</strong> <span id="loggedUserText"></span>
          <div class="small text-muted" id="storageTypeText"></div>
        </div>
        <button id="logoutBtn" type="button" class="btn btn-sm btn-outline-success">Cerrar sesión</button>
      </div>
    </div>

    <!-- Botón disparador del modal -->
    <button type="button" class="btn btn-primary btn-lg px-4 shadow-sm fw-semibold"
      data-bs-toggle="modal" data-bs-target="#exampleModal">
      Abrir Modal de Log-In
    </button>
  </div>

  <!-- Ventana Modal Bootstrap 5 -->
  <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content shadow-lg">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title fw-bold" id="exampleModalLabel">🔐 Acceso de Usuario</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>

        <form id="loginForm" novalidate>
          <div class="modal-body p-4">
            <h4 class="text-center fw-bold mb-3">Bienvenido</h4>
            <div id="modalError" class="alert alert-danger py-2 small d-none">
              Ingresa un usuario válido y una contraseña de al menos 4 caracteres.
            </div>

            <div class="mb-3">
              <label for="username" class="form-label fw-semibold">Usuario o Correo</label>
              <input type="text" class="form-control" id="username" placeholder="ej. fredy.martinez" required />
            </div>

            <div class="mb-3">
              <label for="password" class="form-label fw-semibold">Contraseña</label>
              <div class="input-group">
                <input type="password" class="form-control" id="password" placeholder="••••••••" minlength="4" required />
                <button type="button" id="togglePassBtn" class="btn btn-outline-secondary" title="Mostrar u ocultar">👁️</button>
              </div>
            </div>

            <div class="d-flex justify-content-between align-items-center">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="rememberMe" checked />
                <label class="form-check-label small" for="rememberMe">Recordarme (localStorage)</label>
              </div>
              <button type="button" id="fillDemoBtn" class="btn btn-link btn-sm p-0 text-decoration-none">Usar Demo</button>
            </div>
          </div>

          <div class="modal-footer bg-light">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary fw-semibold">Iniciar Sesión</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Clave compartida para guardar la sesión demo
    const SESSION_KEY = "login_demo_user";

    const loginForm = document.getElementById("loginForm");
    const sessionAlert = document.getElementById("sessionAlert");
    const loggedUserText = document.getElementById("loggedUserText");
    const storageTypeText = document.getElementById("storageTypeText");
    const logoutBtn = document.getElementById("logoutBtn");
    const modalEl = document.getElementById("exampleModal");
    const modalError = document.getElementById("modalError");
    const passInput = document.getElementById("password");
    const togglePassBtn = document.getElementById("togglePassBtn");
    const rememberMe = document.getElementById("rememberMe");

    /** Actualiza el banner superior si hay sesión en localStorage o sessionStorage. */
    function syncSessionBanner() {
      const localUser = localStorage.getItem(SESSION_KEY);
      const tempUser = sessionStorage.getItem(SESSION_KEY);
      const activeUser = localUser || tempUser;

      if (activeUser) {
        loggedUserText.textContent = activeUser;
        storageTypeText.textContent = localUser
          ? "Guardado en localStorage (persiste al cerrar navegador)"
          : "Guardado en sessionStorage (solo esta pestaña)";
        sessionAlert.classList.remove("d-none");
      } else {
        sessionAlert.classList.add("d-none");
      }
    }

    // Alterna visibilidad de la contraseña
    togglePassBtn.addEventListener("click", () => {
      const isHidden = passInput.type === "password";
      passInput.type = isHidden ? "text" : "password";
      togglePassBtn.textContent = isHidden ? "🙈" : "👁️";
    });

    // Rellena credenciales demo para probar rápido
    document.getElementById("fillDemoBtn").addEventListener("click", () => {
      document.getElementById("username").value = "fredy.martinez";
      passInput.value = "Demo1234";
    });

    // Valida el formulario, guarda la sesión según "Recordarme" y cierra el modal
    loginForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const user = document.getElementById("username").value.trim();
      const pass = passInput.value.trim();

      if (!user || pass.length < 4) {
        modalError.classList.remove("d-none");
        return;
      }
      modalError.classList.add("d-none");

      if (rememberMe.checked) {
        localStorage.setItem(SESSION_KEY, user);
        sessionStorage.removeItem(SESSION_KEY);
      } else {
        sessionStorage.setItem(SESSION_KEY, user);
        localStorage.removeItem(SESSION_KEY);
      }

      syncSessionBanner();
      loginForm.reset();
      passInput.type = "password";
      togglePassBtn.textContent = "👁️";

      const modalInstance = bootstrap.Modal.getInstance(modalEl);
      if (modalInstance) modalInstance.hide();
    });

    // Cierra sesión limpiando ambos almacenamientos
    logoutBtn.addEventListener("click", () => {
      localStorage.removeItem(SESSION_KEY);
      sessionStorage.removeItem(SESSION_KEY);
      syncSessionBanner();
    });

    // Verificación inicial al cargar la página
    syncSessionBanner();
  </script>
</body>
</html>
