<!--
  ============================================================================
  FORMULARIO DINÁMICO DE REGISTRO DE ASPIRANTES (Formulario/index.html)
  ============================================================================
  Propósito educativo (Curso MEAN Stack):
  1. Campos obligatorios: Nombres, Apellidos, Aspiración Salarial (>= 0),
     Correo Electrónico válido, Género y Cargo.
  2. Cargos disponibles: Desarrollador, Gerente de Proyecto, Líder Administrativo,
     Conductor y Otros (habilita dinámicamente un campo adicional).
  3. Reglas visuales del taller: botón azul (`.btn-primary`) para Hombre y
     botón rosado (`.btn-pink`) para Mujer.
  4. Persistencia en `localStorage`, búsqueda en vivo, eliminación individual,
     exportación a archivo `.json` e inspector JSON en tiempo real.
-->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro de Aspirantes — JSON &amp; localStorage</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" />
  <style>
    /* Tema oscuro moderno con scrollbars a juego */
    body {
      background: radial-gradient(circle at top, #1e1b4b 0%, #0b1120 60%);
      color: #f8fafc;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
    }
    .form-card {
      background: rgba(17, 24, 39, 0.92);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 1rem;
      box-shadow: 0 18px 40px rgba(2, 6, 23, 0.45);
    }
    .btn-pink {
      background: #ff0080 !important;
      color: #ffffff !important;
      border: none;
    }
    .btn-pink:hover {
      background: #d6006b !important;
      color: #ffffff !important;
    }
    pre {
      background: #020617;
      color: #38bdf8;
      border: 1px solid #1e293b;
      border-radius: 0.75rem;
      max-height: 220px;
      overflow: auto;
    }
    * { scrollbar-width: thin; scrollbar-color: rgba(56, 189, 248, 0.45) #0b1120; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0b1120; }
    ::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.45); border-radius: 999px; border: 2px solid #0b1120; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(56, 189, 248, 0.8); }
  </style>
</head>
<body class="py-4">
  <div class="container">
    <header class="d-flex flex-wrap justify-content-between align-items-center mb-4 pb-3 border-bottom border-secondary gap-2">
      <div>
        <span class="badge bg-info text-dark mb-1">Validación DOM • JSON • localStorage</span>
        <h1 class="h3 fw-bold mb-0">📋 Registro de Aspirantes</h1>
      </div>
      <span id="totalBadge" class="badge bg-secondary px-3 py-2">0 registrados</span>
    </header>

    <div class="row g-4">
      <!-- Columna izquierda: Formulario de registro -->
      <div class="col-lg-5">
        <form id="registroForm" class="form-card p-4 d-flex flex-column gap-3">
          <h5 class="fw-bold mb-0">Nuevo Aspirante</h5>

          <div id="alertCorrect" class="alert alert-success py-2 small mb-0 d-none" role="alert">
            ✅ Aspirante registrado exitosamente en la lista JSON.
          </div>
          <div id="alertIncorrect" class="alert alert-danger py-2 small mb-0 d-none" role="alert">
            ⚠️ Verifica todos los campos obligatorios (*) y un correo/salario válido.
          </div>

          <div class="row g-2">
            <div class="col-6">
              <label for="nombre" class="form-label small text-secondary mb-1">Nombre *</label>
              <input type="text" id="nombre" class="form-control form-control-sm bg-dark text-white border-secondary" placeholder="Nombre" />
            </div>
            <div class="col-6">
              <label for="apellido" class="form-label small text-secondary mb-1">Apellido *</label>
              <input type="text" id="apellido" class="form-control form-control-sm bg-dark text-white border-secondary" placeholder="Apellido" />
            </div>
          </div>

          <div>
            <label for="aspiracion" class="form-label small text-secondary mb-1">Aspiración Salarial (COP) *</label>
            <input type="number" id="aspiracion" min="0" class="form-control form-control-sm bg-dark text-white border-secondary" placeholder="Ej. 3500000" />
          </div>

          <div>
            <label for="correo" class="form-label small text-secondary mb-1">Correo electrónico *</label>
            <input type="email" id="correo" class="form-control form-control-sm bg-dark text-white border-secondary" placeholder="nombre@correo.com" />
          </div>

          <div class="row g-2">
            <div class="col-6">
              <label class="form-label small text-secondary d-block mb-1">Género *</label>
              <div class="form-check form-check-inline">
                <input onclick="blue()" class="form-check-input" type="radio" name="genero" id="hombre" />
                <label class="form-check-label small" for="hombre">Hombre</label>
              </div>
              <div class="form-check form-check-inline">
                <input onclick="pink()" class="form-check-input" type="radio" name="genero" id="mujer" />
                <label class="form-check-label small" for="mujer">Mujer</label>
              </div>
            </div>
            <div class="col-6">
              <label for="cargo" class="form-label small text-secondary mb-1">Cargo *</label>
              <select id="cargo" class="form-select form-select-sm bg-dark text-white border-secondary">
                <option value="" selected disabled>--Seleccione--</option>
                <option value="Desarrollador">Desarrollador</option>
                <option value="Gerente de Proyecto">Gerente de Proyecto</option>
                <option value="Líder Administrativo">Líder Administrativo</option>
                <option value="Conductor">Conductor</option>
                <option value="otros">Otros</option>
              </select>
            </div>
          </div>

          <input type="text" id="otro" class="form-control form-control-sm bg-dark text-white border-secondary d-none" placeholder="Especifica el cargo *" />

          <button id="submit" type="submit" class="btn btn-primary fw-bold mt-1">Registrar Aspirante</button>
        </form>
      </div>

      <!-- Columna derecha: Lista filtrable + Inspector JSON -->
      <div class="col-lg-7 d-flex flex-column gap-4">
        <div class="form-card p-3">
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <input id="searchInput" type="search" class="form-control form-control-sm bg-dark text-white border-secondary" style="max-width: 260px;" placeholder="🔍 Buscar por nombre o cargo..." />
            <div class="d-flex gap-2">
              <button id="btnExportJson" type="button" class="btn btn-outline-info btn-sm">⬇ Exportar JSON</button>
              <button id="btnClearAll" type="button" class="btn btn-outline-danger btn-sm">🗑 Limpiar</button>
            </div>
          </div>
          <ul id="listaRegistros" class="list-group list-group-flush"></ul>
        </div>

        <div class="form-card p-3">
          <h6 class="fw-bold mb-2">📡 Colección JSON en Vivo (<code>localStorage</code>)</h6>
          <pre id="jsonViewer" class="p-3 small mb-0">[]</pre>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
