<!--
  ============================================================================
  BUSCADOR DEL SIGUIENTE NÚMERO PRIMO (JS-BIT-programing/index.html)
  ============================================================================
  Propósito educativo (Curso MEAN Stack):
  1. Verificar si un número entero positivo es primo en complejidad O(sqrt(n)).
  2. Explicar el primer divisor exacto cuando un número es compuesto.
  3. Mostrar el siguiente primo, los próximos 5 primos, iteraciones y tiempo en ms.
-->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Algoritmo: Siguiente Número Primo (JS-BIT)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" />
  <style>
    /* Tema oscuro moderno con scrollbars a juego */
    body {
      background: radial-gradient(circle at top, #1e3a8a 0%, #0b1120 60%);
      color: #f8fafc;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
    }
    .prime-card {
      background: rgba(17, 24, 39, 0.92);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 1rem;
      box-shadow: 0 18px 40px rgba(2, 6, 23, 0.45);
    }
    * { scrollbar-width: thin; scrollbar-color: rgba(56, 189, 248, 0.45) #0b1120; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0b1120; }
    ::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.45); border-radius: 999px; border: 2px solid #0b1120; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(56, 189, 248, 0.8); }
  </style>
</head>
<body class="py-5">
  <div class="container" style="max-width: 640px;">
    <div class="prime-card p-4">
      <div class="text-center mb-4">
        <span class="badge bg-info text-dark mb-2">Algoritmo O(√n) • Postulado de Bertrand</span>
        <h2 class="fw-bold mb-1">🔢 Buscador de Números Primos</h2>
        <p class="small text-secondary mb-0">
          Verifica primalidad, descubre el primer divisor exacto y calcula los siguientes 5 primos.
        </p>
      </div>

      <!-- Entrada numérica y botones -->
      <div class="input-group mb-3">
        <input type="number" id="numInput" class="form-control bg-dark text-white border-secondary"
          placeholder="Ej: 14 (máx. 1,000,000,000)" min="1" max="1000000000" value="14" />
        <button onclick="calcularDesdeInput()" class="btn btn-info text-dark fw-bold" type="button">Analizar</button>
        <button onclick="ejecutarConPrompt()" class="btn btn-outline-secondary" type="button">Prompt</button>
      </div>

      <!-- Resultado principal y análisis matemático -->
      <div id="resultadoPrimo"></div>

      <!-- Historial reciente de números consultados -->
      <div id="historialBox" class="mt-4 d-none">
        <h6 class="small text-secondary fw-bold mb-2">Historial reciente:</h6>
        <div id="historialTags" class="d-flex flex-wrap gap-2"></div>
      </div>
    </div>
  </div>

  <script src="js/script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
