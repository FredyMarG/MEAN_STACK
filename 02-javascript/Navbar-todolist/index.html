<!--
  ============================================================================
  DASHBOARD NAVBAR + TO-DO LIST (Navbar-todolist/index.html)
  ============================================================================
  Propósito educativo (Curso MEAN Stack):
  Interfaz oscura con barra de navegación superior, buscador en tiempo real,
  filtros por estado (`Todas`, `Pendientes`, `Completadas`), contador de
  pendientes y persistencia en `localStorage`.
-->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <title>Dashboard To-Do List | MEAN Stack</title>
</head>
<body class="nt-body">
  <!-- Barra de navegación superior con buscador en vivo -->
  <header class="nt-navbar d-flex flex-wrap align-items-center justify-content-between px-4 py-3 gap-2">
    <div class="d-flex align-items-center gap-2">
      <span class="badge bg-info text-dark">Web Storage</span>
      <span class="fw-bold fs-5 text-white">Pro Night • To-Do</span>
    </div>
    <form class="d-flex align-items-center gap-2" role="search" onsubmit="return false;">
      <div class="input-group input-group-sm">
        <span class="input-group-text bg-dark text-info border-secondary"><i class="bi bi-search"></i></span>
        <input id="filterTasksInput" class="form-control bg-dark text-white border-secondary"
          type="search" placeholder="Filtrar tareas..." aria-label="Filtrar tareas" />
      </div>
    </form>
  </header>

  <!-- Contenido principal -->
  <main class="container py-5" style="max-width: 680px;">
    <div class="nt-card p-4">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h4 fw-bold text-white mb-0">✅ Lista de Tareas</h1>
        <div class="d-flex align-items-center gap-2">
          <span id="pendingBadge" class="badge bg-info text-dark">0 pendientes</span>
          <button id="clearDoneBtn" type="button" class="btn btn-outline-secondary btn-sm">Limpiar completadas</button>
        </div>
      </div>

      <!-- Formulario para agregar nueva tarea -->
      <form id="addTaskForm" class="d-flex gap-2 mb-3">
        <input id="taskInput" type="text" class="form-control bg-dark text-white border-secondary"
          placeholder="Agregar nueva tarea..." />
        <button type="submit" class="btn btn-info text-dark fw-bold btn-add px-4">+</button>
      </form>

      <!-- Filtros de estado -->
      <div class="d-flex flex-wrap gap-2 mb-3">
        <button type="button" class="btn btn-sm btn-info text-dark fw-semibold filter-status-btn" data-status="all">Todas</button>
        <button type="button" class="btn btn-sm btn-outline-secondary text-light filter-status-btn" data-status="pending">Pendientes</button>
        <button type="button" class="btn btn-sm btn-outline-secondary text-light filter-status-btn" data-status="done">Completadas</button>
      </div>

      <ul id="tasksList" class="ul-todo list-unstyled mb-0"></ul>
      <div class="empty text-secondary text-center py-4">No tienes tareas para mostrar.</div>
    </div>
  </main>

  <script src="js/bootstrap.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
