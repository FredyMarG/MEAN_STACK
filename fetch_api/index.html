<!--
  ============================================================================
  CONSUMO DE API REST CON FETCH Y PROMESAS (fetch_api/index.html)
  ============================================================================
  Propósito educativo (Curso MEAN Stack):
  Demostrar el uso de `fetch()` con Promesas (`.then() / .catch()`),
  consulta por ID único o múltiple, personaje aleatorio e inspección en vivo
  de la URL consultada, tiempo de respuesta y JSON recibido.
-->
<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fetch API + Promesas — Rick &amp; Morty</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      /* Paleta oscura cian consistente con el Hub */
      body {
        background: radial-gradient(circle at top, #0c4a6e 0%, #0b1120 60%);
        color: #f8fafc;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        min-height: 100vh;
      }
      .fetch-card {
        background: rgba(17, 24, 39, 0.92);
        border: 1px solid rgba(56, 189, 248, 0.25);
        border-radius: 1rem;
        box-shadow: 0 18px 40px rgba(2, 6, 23, 0.45);
      }
      pre {
        background: #020617;
        color: #38bdf8;
        border: 1px solid #1e293b;
        border-radius: 0.75rem;
        max-height: 240px;
        overflow: auto;
      }
      /* Scrollbars oscuros con acento cian */
      * { scrollbar-width: thin; scrollbar-color: rgba(56, 189, 248, 0.45) #0b1120; }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: #0b1120; }
      ::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.45); border-radius: 999px; border: 2px solid #0b1120; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(56, 189, 248, 0.8); }
    </style>
  </head>
  <body class="py-4">
    <div class="container">
      <!-- Cabecera y barra de consulta por IDs -->
      <header class="fetch-card p-4 mb-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
          <div>
            <span class="badge bg-info text-dark mb-1">Fetch API • .then() / .catch()</span>
            <h1 class="h3 fw-bold mb-0 text-info">⚡ Consumo de API con Promesas (Fetch)</h1>
          </div>
          <span id="latencyBadge" class="badge bg-dark border border-secondary px-3 py-2">Listo</span>
        </div>

        <form id="idsForm" class="row g-2 align-items-center mb-2">
          <div class="col-md-6">
            <input id="idsInput" type="text" class="form-control form-control-sm bg-dark text-white border-secondary"
              value="1,183" placeholder="ID único o separados por coma (ej. 1,2,3,183)" required />
          </div>
          <div class="col-md-6 d-flex flex-wrap gap-2">
            <button type="submit" class="btn btn-info text-dark btn-sm fw-bold">Consultar IDs</button>
            <button id="btnRandom" type="button" class="btn btn-outline-warning btn-sm fw-semibold">🎲 Aleatorio</button>
            <button type="button" class="btn btn-outline-secondary btn-sm preset-btn" data-ids="1,2,3,4,5">Familia Smith</button>
          </div>
        </form>

        <small class="text-secondary">
          Endpoint consultado: <code id="endpointUrl" class="text-info"></code>
        </small>
      </header>

      <!-- Tarjetas de personajes + Inspector JSON de la Promesa -->
      <div class="row g-4">
        <div class="col-lg-7">
          <div id="printer" class="row g-3"></div>
        </div>
        <div class="col-lg-5">
          <div class="fetch-card p-3">
            <h6 class="fw-bold mb-2">📡 JSON Recibido (<code>response.json()</code>)</h6>
            <pre id="jsonOutput" class="p-3 small mb-0">// Esperando respuesta de fetch()...</pre>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
