<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer | Procrastination Nightmare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Icons+Outlined" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Icons" />
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css" />
</head>

<body>
    <div class="big-container d-flex">
        <div class="navbar-lateral">
            <nav class="lateral-navbar top-0 bottom-0 left-0 overflow-hidden text-white">
                <ul class="px-0">
                    <li class="list-unstyled">
                        <div class="main-logo text-center d-flex mt-3">
                            <img src="assets/img/logo.svg" class="rounded-circle logo-navbar" alt="Logo Pro Night" />
                            <span class="fw-bold text-uppercase fs-5 mx-4">Pro night</span>
                        </div>
                    </li>
                    <li class="list-unstyled mt-1"><a href="index.html" class="link-lateral-navbar fs-6 text-decoration-none position-relative"><i class="fi fi-rr-home"></i><span class="name-option position-relative ms-3">Inicio</span></a></li>
                    <li class="list-unstyled mt-1"><a href="pomodoro.html" class="link-lateral-navbar fs-6 text-decoration-none position-relative"><i class="fi fi-rr-clock"></i><span class="name-option position-relative ms-3">Pomodoro</span></a></li>
                    <li class="list-unstyled"><a href="to-do-list.html" class="link-lateral-navbar fs-6 text-decoration-none position-relative"><i class="fi fi-rr-check-circle"></i><span class="name-option position-relative ms-3">Lista de tareas</span></a></li>
                    <li class="list-unstyled"><a href="notas.html" class="link-lateral-navbar fs-6 text-decoration-none position-relative"><i class="fi fi-rr-document"></i><span class="name-option position-relative ms-3">Notas</span></a></li>
                    <li class="list-unstyled"><a href="calendario.html" class="link-lateral-navbar fs-6 text-decoration-none position-relative"><i class="fi fi-rr-calendar"></i><span class="name-option position-relative ms-3">Calendario</span></a></li>
                    <li class="list-unstyled"><a href="habitos.html" class="link-lateral-navbar fs-6 text-decoration-none position-relative"><i class="fi fi-rr-refresh"></i><span class="name-option position-relative ms-3">Hábitos</span></a></li>
                    <li class="list-unstyled"><a href="roadMapTareas.html" class="link-lateral-navbar fs-6 text-decoration-none position-relative"><i class="fi fi-rr-table-list"></i><span class="name-option position-relative ms-3">Roadmap</span></a></li>
                                    <li class="list-unstyled"><a href="landing-full-bootstrap/index.html" class="link-lateral-navbar fs-6 text-decoration-none position-relative"><i class="fi fi-rr-globe"></i><span class="name-option position-relative ms-3">Landing</span></a></li>
                </ul>
            </nav>
        </div>

        <div class="section-space-work">
            <nav class="navbar navbar-expand-lg background-navbar-superior">
                <div class="container-fluid">
                    <a class="navbar-brand" href="#">
                        <p style="color:white; margin: 0;">Temporizador Pomodoro</p>
                    </a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                        data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                        aria-expanded="false" aria-label="Toggle navigation">
                        <i class="fa-solid fa-bars" style="color: white;"></i>
                    </button>
                    <div class="collapse navbar-collapse c-nav-superior" id="navbarSupportedContent">
                        <div class="input-group c-nav-items-toogle d-flex d-lg-none justify-content-end align-items-center ms-auto" style="max-width: 20rem;">
                            <label class="input-group-text" for="inputGroupSelect01">Ir a</label>
                            <select class="form-select" id="inputGroupSelect01" onchange="if(this.value) window.location.href=this.value;">
                                <option value="" selected>Seleccionar módulo...</option>
                                <option value="index.html">Inicio</option>
                                <option value="pomodoro.html">Pomodoro</option>
                                <option value="to-do-list.html">Lista de tareas</option>
                                <option value="notas.html">Notas</option>
                                <option value="calendario.html">Calendario</option>
                                <option value="habitos.html">Hábitos</option>
                                <option value="roadMapTareas.html">Roadmap</option>
                            </select>
                        </div>
                    </div>
                </div>
            </nav>

            <div class="container space-work py-4">
                <div class="pn-pomodoro-card text-white text-center">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="badge bg-info bg-opacity-25 text-info border border-info border-opacity-25 px-3 py-2" id="pomodoroModeLabel">
                            🔥 Modo Enfoque (25 min)
                        </span>
                        <span class="badge bg-success bg-opacity-25 text-success border border-success border-opacity-25 px-3 py-2" id="pomodoroSessionsBadge">
                            0 sesiones hoy
                        </span>
                    </div>

                    <div class="c-election-pomodoro d-flex justify-content-center gap-3 my-3">
                        <button type="button" class="btn btn-outline-info rounded-pill px-4 fw-bold pn-mode-btn active" id="btn-work">
                            <span id="button-work">TRABAJO (25m)</span>
                        </button>
                        <button type="button" class="btn btn-outline-success rounded-pill px-4 fw-bold pn-mode-btn" id="btn-rest">
                            <span id="button-rest">DESCANSO (5m)</span>
                        </button>
                    </div>

                    <div class="c-timer-pomodoro d-flex justify-content-center my-4">
                        <div class="pn-timer-ring" id="pomodoroRing" style="--progress: 100%;">
                            <div class="pn-timer-inner">
                                <h3 class="mb-0" style="color:#f8fafc; font-size: 3.75rem; font-weight: 800;" id="time-text-pomodoro">25:00</h3>
                                <small class="text-secondary" id="pomodoroStatusText">Listo para iniciar</small>
                            </div>
                        </div>
                    </div>

                    <div class="c-start-pomodoro d-flex justify-content-center gap-3">
                        <button type="button" class="btn btn-info text-dark fw-bold rounded-pill px-5 py-2" id="startButton">
                            ▶ START
                        </button>
                        <button type="button" class="btn btn-outline-light rounded-pill px-4 py-2" id="resetButton">
                            ↺ REINICIAR
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="./js/carlos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
    <script src="./js/nav-active.js"></script>
</body>

</html>
