<!--
  ============================================================================
  EJERCICIO 3: PREMIACIÓN DE UNA PIZZERÍA (pizza.html)
  ============================================================================
  Propósito: Determinar si un cliente recibe un premio adicional según su
  edad y sexo mediante la función `premio()` en `js/sumar_numeros.js`.
-->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css">
    <title>Premiación de una pizzería</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary shadow-sm mb-4">
        <div class="container-fluid">
          <a class="navbar-brand fw-bold" href="index.html">⚡ Lógica JS</a>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
              <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
              <li class="nav-item"><a class="nav-link" href="suma_numeros.html">Sumar Números</a></li>
              <li class="nav-item"><a class="nav-link" href="par_impar.html">Par o Impar</a></li>
              <li class="nav-item"><a class="nav-link active fw-semibold" href="pizza.html">Pizzería</a></li>
              <li class="nav-item"><a class="nav-link" href="menu.html">Menú Texto</a></li>
              <li class="nav-item"><a class="nav-link" href="menu_checkbox.html">Menú Checkbox</a></li>
              <li class="nav-item"><a class="nav-link" href="tablas_multiplicar.html">Tablas</a></li>
              <li class="nav-item"><a class="nav-link" href="descuentos.html">Descuentos</a></li>
            </ul>
          </div>
        </div>
    </nav>

    <div class="text-center d-flex justify-content-center align-items-center p-4 border rounded-3 shadow-sm w-50 flex-wrap mx-auto">
        <h1>Premios de la pizzería</h1>
        <label class="w-100 m-2" for="edad">Ingrese la edad de la persona</label>
        <input class="form-control w-75" type="number" min="0" max="105" id="edad" placeholder="Ej: 22"> 
        <div class="w-100 m-3">
            <label class="fw-semibold me-2">Sexo:</label>
            <input class="mx-2 form-check-input" type="radio" name="sexo" value="hombre" id="hombre"><label for="hombre">Hombre</label>
            <input class="mx-2 form-check-input" type="radio" name="sexo" value="mujer" id="mujer"><label for="mujer">Mujer</label>
        </div>

        <button onclick="premio()" class="btn btn-primary m-2" type="button">Consultar Premio</button>
        <p class="w-100 mt-2 rounded-2" id="premio"></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/sumar_numeros.js"></script>
</body>
</html>
