<!--
  ============================================================================
  EXPLORADOR COMPLETO DE THE RICK AND MORTY API (rickandmorty_api/index.html)
  ============================================================================
  Propósito: Catálogo visual de personajes de Rick and Morty con filtro de
  búsqueda en tiempo real y consumo dinámico de la API pública.
  Complemento realizado: Se conectó con el nuevo controlador `script.js` que
  estaba vacío (0 bytes) y se conservaron las tarjetas de respaldo.
-->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css">
    <title>The Rick and Morty API Explorer</title>
</head>
<body class="bg-white">

    <div class="container py-4">
        <h1 style="font-size: 3.5rem;" class="w-100 mx-auto text-center fw-bold mb-3">The Rick and Morty API</h1>
        <div class="row justify-content-center mb-4">
            <div class="col-md-6 d-flex gap-2">
                <input type="text" id="searchInput" class="form-control" placeholder="Buscar personaje por nombre (ej. Rick, Morty, Summer)...">
                <button id="searchBtn" class="btn btn-dark px-4">Buscar</button>
            </div>
        </div>
    </div>

    <div id="charactersContainer" class="w-100 bg-black d-flex flex-wrap justify-content-around align-items-stretch p-4 gap-4">
        <!-- Renderizado dinámico desde script.js -->
    </div>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
