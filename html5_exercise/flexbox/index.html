<!--
  ============================================================================
  MAQUETACIÓN SEMÁNTICA CON FLEXBOX (html5_exercise/flexbox/index.html)
  ============================================================================
  Propósito: Diagramar la estructura clásica de una página web (`header`, `nav`,
  contenedor flex con `section` + `article` y `aside` lateral, y `footer`).
-->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Maquetación Semántica HTML5 + Flexbox</title>
</head>
<body>
    
  <header>
    <h1>HEADER</h1>
  </header>
  
  <nav>
    <h1>NAV</h1>
  </nav>

  <!-- Contenedor Flexbox que alinea SECTION (izquierda) y ASIDE (derecha) -->
  <div class="container">
    <section>
        <h1>SECTION</h1>
        <article><h1>ARTICLE</h1></article>
    </section>
    
    <aside>
        <h1>ASIDE</h1>
    </aside>
  </div>

  <footer>
    <h1>FOOTER</h1>
  </footer>

</body>
</html>
